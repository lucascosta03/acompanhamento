<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejamento financeiro</title>
<style>
:root{--bg:#f6f7fb;--cd:#fff;--tx:#1b1f2a;--mu:#667085;--ac:#2f5bea;--ok:#12805c;--bd:#c0362c;--ln:#e3e6ee;--yl:#fff3b8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--cd:#1c1f27;--tx:#eceef4;--mu:#9aa3b5;--ac:#8aa8ff;--ok:#4cc79a;--bd:#ff7b70;--ln:#2b2f3a;--yl:#4a4210;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--cd:#1c1f27;--tx:#eceef4;--mu:#9aa3b5;--ac:#8aa8ff;--ok:#4cc79a;--bd:#ff7b70;--ln:#2b2f3a;--yl:#4a4210;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:14px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;color:var(--mu);border:1px solid var(--ln);border-radius:99px;padding:2px 10px}
nav{display:flex;gap:6px;margin:14px 0}
nav button{flex:1;padding:9px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu)}
input,select{width:100%;box-sizing:border-box;margin-top:3px;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.ph{background:var(--yl)}
.k{font-size:12px;color:var(--mu)}.v{font-size:22px;font-weight:650;margin-top:2px}.pos{color:var(--ok)}.neg{color:var(--bd)}
.note{font-size:13px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
svg{width:100%;height:auto}.gl{stroke:var(--ln)}.ax{fill:var(--mu);font-size:11px}.rs{stroke:var(--bd);stroke-width:1.2}.pl{fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:6 4;opacity:.8}.rl{fill:none;stroke:var(--tx);stroke-width:2.4}.rd{fill:var(--tx)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
.btn{padding:6px 10px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
.er{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:6px;align-items:end;margin-bottom:8px}
@media (max-width:560px){.er{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app">
<div class="top"><h1>Planejamento financeiro</h1><span class="pill" id="st">Carregando…</span></div>
<div class="note" id="sub"></div>
<nav><button data-t="s">Semana</button><button data-t="p">Plano</button><button data-t="a">Ajustes</button></nav>
<div id="main"></div></div>
<script>
const DAY=864e5,$=s=>document.querySelector(s);
const dn=s=>{const[a,b,c]=s.split("-").map(Number);return Date.UTC(a,b-1,c)/DAY},iso=n=>new Date(n*DAY).toISOString().slice(0,10),dom=n=>new Date(n*DAY).getUTCDate();
const dm=n=>{const d=new Date(n*DAY);return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")};
const E=v=>v==null||isNaN(v)?"–":v.toLocaleString("pt-BR",{style:"currency",currency:"EUR"});
const R=v=>v==null||isNaN(v)?"–":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const sg=v=>v==null?"":v>=0?"pos":"neg";
const DEF={lucas:{rate:18.5,hrs:30,mode:"m",day:24,ref:"2026-11-20"},
pen:{rate:14.15,hrs:12,mode:"q",day:1,ref:"2026-11-20"},
bk:{rate:14.15,hrs:28,mode:"m",day:28,ref:"2026-11-27"},
tl:.12,ty:.12,reserve:1000,aporte:1666.67,apDay:25,fx:6,outros:0,saldo0:3809.56,saldoDate:"2026-11-18",start:"2026-11-16",end:"2027-05-31",
inv:{l:153136.24,y:29176.41},
exp:[{n:"Aluguel",v:1200,f:"m",d:1,p:1},{n:"Academia",v:50,f:"m",d:10,p:2},{n:"Celular",v:20,f:"m",d:5,p:2},{n:"Mercado",v:75,f:"w",d:0,p:1},{n:"Lavagem de roupas",v:10,f:"w",d:0,p:1}]};
const mg=(d,o)=>o==null?d:(Array.isArray(d)||typeof d!=="object")?o:Object.fromEntries(Object.keys(d).map(k=>[k,mg(d[k],o[k])]));
let S={cfg:JSON.parse(JSON.stringify(DEF)),weeks:{}},tab="s",cur=null,ref=null,tm=null;
const today=dn(new Date().toLocaleDateString("sv"));

const tot=x=>x.sl!=null||x.sy!=null?(x.sl||0)+(x.sy||0):x.s;
function calc(){
 const c=S.cfg,wk=52/12,st=dn(c.start),en=dn(c.end),base=dn(c.saldoDate),tl=c.tl,ty=c.ty;
 const jobs=[[c.lucas,tl],[c.pen,ty],[c.bk,ty]];
 const wInc=jobs.reduce((a,[j,t])=>a+j.hrs*j.rate*(1-t),0);
 const hit=(j,n)=>j.mode==="q"?(((n-dn(j.ref))%14)+14)%14===0:j.mode==="w"?(((n-dn(j.ref))%7)+7)%7===0:dom(n)===+j.day;
 const pay=(j,t)=>j.hrs*j.rate*(1-t)*(j.mode==="q"?2:j.mode==="w"?1:wk);
 let plan=c.saldo0,prev=c.saldo0;const rows=[];
 for(let w=st;w<=en;w+=7){
  let cnt=0,inc=0,fx=0,ap=0;
  for(let i=0;i<7;i++){const n=w+i;if(n<=base)continue;cnt++;
   for(const[j,t]of jobs)if(hit(j,n))inc+=pay(j,t);
   for(const e of c.exp)if(e.f==="m"&&dom(n)===+e.d)fx+=e.v*e.p;
   if(dom(n)===+c.apDay)ap+=c.aporte}
  for(const e of c.exp)if(e.f==="w")fx+=e.v*e.p*cnt/7;
  const flow=inc-fx-ap-c.outros/wk*cnt/7;plan+=flow;
  const k=iso(w),x=S.weeks[k]||{},tc=tot(x),filled=x.l!=null||x.b!=null||tc!=null;
  const real=filled?(x.l||0)*c.lucas.rate*(1-tl)+(x.p!=null?x.p:c.pen.hrs)*c.pen.rate*(1-ty)+(x.b||0)*c.bk.rate*(1-ty):null;
  const dev=tc!=null&&prev!=null?tc-prev-flow:null;
  rows.push({w,k,flow,plan,s:tc,sl:x.sl,sy:x.sy,rl:(x.l||0)*c.lucas.rate,ry:(x.p!=null?x.p:c.pen.hrs)*c.pen.rate+(x.b||0)*c.bk.rate,real,filled,dev,ap});prev=tc!=null?tc:null}
 const wFix=c.exp.reduce((a,e)=>a+(e.f==="m"?e.v*e.p/wk:e.v*e.p),0);
 const free=wInc-wFix-c.aporte/wk-c.outros/wk;
 return{rows,wInc,free,sumAp:rows.reduce((a,r)=>a+r.ap,0)}}

function setSt(t){$("#st").textContent=t}
function save(){setSt("Salvando…");clearTimeout(tm);tm=setTimeout(async()=>{
 const d=JSON.parse(JSON.stringify({cfg:S.cfg,weeks:S.weeks}));
 try{if(ref){await ref.set(d);setSt("Salvo")}else{localStorage.setItem("pf",JSON.stringify(d));setSt("Salvo só neste navegador")}}
 catch(e){setSt("Não foi possível salvar")}},500)}
function apply(d){if(!d)return;S.cfg=mg(DEF,d.cfg);if(d.cfg&&Array.isArray(d.cfg.exp))S.cfg.exp=d.cfg.exp;S.weeks=d.weeks||{}}
function refresh(){if(/INPUT|SELECT/.test(document.activeElement.tagName)){if(tab==="s")out()}else show(tab)}

function chart(rows){
 const W=640,H=250,pl=48,pr=10,pt=10,pb=26,res=S.cfg.reserve;
 const vs=[res,...rows.map(r=>r.plan),...rows.filter(r=>r.s!=null).map(r=>r.s)];
 let lo=Math.min(...vs),hi=Math.max(...vs);const pd=(hi-lo)*.08||100;lo-=pd;hi+=pd;
 const X=i=>pl+(W-pl-pr)*(rows.length<2?0:i/(rows.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));let g="";
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" class="ax">${Math.round(v/100)*100}</text>`}
 rows.forEach((r,i)=>{if(i%4===0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="ax">${dm(r.w)}</text>`});
 g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(res)}" y2="${Y(res)}" class="rs"/><polyline class="pl" points="${rows.map((r,i)=>X(i)+","+Y(r.plan)).join(" ")}"/>`;
 const pts=rows.map((r,i)=>r.s!=null?[X(i),Y(r.s)]:null).filter(Boolean);
 g+=`<polyline class="rl" points="${pts.join(" ")}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" class="rd"/>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo planejado e realizado">${g}</svg><div class="lg"><span>- - Planejado</span><span>● Realizado</span><span style="color:var(--bd)">— Reserva</span></div>`}

function sem(){
 const{rows}=calc();
 const o=rows.map(r=>`<option value="${r.k}" ${r.k===cur?"selected":""}>${dm(r.w)} a ${dm(r.w+6)}${r.filled?" ✓":""}</option>`).join("");
 const x=S.weeks[cur]||{},p=S.cfg.pen.hrs;
 const f=[["l","Lucas (horas)",x.l,""],["p","Yohana, Penneys (horas)",x.p,p],["b","Yohana, Burger King (horas)",x.b,""],["sl","Saldo em conta, Lucas (€)",x.sl,""],["sy","Saldo em conta, Yohana (€)",x.sy,""]];
 return `<div class="card"><label>Semana<select id="wsel">${o}</select></label><div class="g2" style="margin-top:10px">`+
 f.map(([k,l,v,ph])=>`<label>${l}<input type="number" step="any" inputmode="decimal" data-w="${k}" value="${v==null?"":v}" placeholder="${ph}"></label>`).join("")+
 `</div><div class="note" style="margin-top:8px">Penneys tem horas fixas: se não digitar, conta ${p} h. Gastos não precisam ser lançados.</div></div><div id="out"></div>`}
function out(){
 const M=calc(),r=M.rows.find(r=>r.k===cur);if(!r||!$("#out"))return;const c=S.cfg;
 const x=S.weeks[cur]||{},hl=x.l||0,hp=x.p!=null?x.p:c.pen.hrs,hb=x.b||0;const lr=r.s==null?null:r.s-c.reserve,lp=r.plan-c.reserve,df=lr==null?null:lr-lp;
 const K=(k,v,cl="",s="")=>`<div class="card"><div class="k">${k}</div><div class="v ${cl}">${v}</div>${s?`<div class="note">${s}</div>`:""}</div>`;
 $("#out").innerHTML=`<div class="g3">${K("Saldo livre realizado",E(lr))}${K("Saldo livre planejado",E(lp))}${K("Diferença (real – plano)",E(df),sg(df))}
 ${K("Renda líquida planejada (semana)",E(M.wInc))}${K("Renda líquida realizada",E(r.real),r.real==null?"":sg(r.real-M.wInc))}${K("Desvio da semana",E(r.dev),sg(r.dev))}${K("Saldo Lucas",E(x.sl))}${K("Saldo Yohana",E(x.sy))}${K("Rendimento Lucas",r.filled?E(r.rl):"–","",hl+" h × "+E(c.lucas.rate))}${K("Rendimento Yohana",r.filled?E(r.ry):"–","",hp+" h × "+E(c.pen.rate)+" + "+hb+" h × "+E(c.bk.rate))}</div>
 <div class="note">Saldo livre = saldo em conta menos a reserva de ${E(c.reserve)}. Se o real ficar abaixo do plano, houve gasto não planejado ou renda menor.</div>`}

function plano(){
 const M=calc(),c=S.cfg,L=M.rows[M.rows.length-1],wl=Math.max(0,Math.ceil((dn(c.end)-today)/7));
 const inv=c.inv.l+c.inv.y,K=(k,v,s="")=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="note">${s}</div></div>`;
 return `<div class="g3">${K("Saldo livre previsto no fim do ciclo",E(L.plan-c.reserve),"até "+c.end.split("-").reverse().join("/"))}
 ${K("Livre por semana (média)",E(M.free),"após fixos, aporte e outros")}
 ${K("Aportes até lá",E(M.sumAp),"≈ "+R(M.sumAp*c.fx))}
 ${K("Investido no Brasil (projeção)",R(inv+M.sumAp*c.fx),"hoje "+R(inv)+", sem rendimento")}</div>
 <h2>Saldo em conta: planejado vs realizado</h2><div class="card">${chart(M.rows)}</div>
 <h2>Semana a semana</h2><div class="card sc"><table><tr><th>Semana</th><th>Rend. Lucas</th><th>Rend. Yohana</th><th>Saldo Lucas</th><th>Saldo Yohana</th><th>Saldo real</th><th>Saldo plan.</th><th>Dif.</th></tr>`+
 M.rows.map(r=>`<tr><td>${dm(r.w)}</td><td>${r.filled?E(r.rl):"–"}</td><td>${r.filled?E(r.ry):"–"}</td><td>${E(r.sl)}</td><td>${E(r.sy)}</td><td>${E(r.s)}</td><td>${E(r.plan)}</td><td class="${sg(r.s==null?null:r.s-r.plan)}">${r.s==null?"–":E(r.s-r.plan)}</td></tr>`).join("")+`</table></div>`}

const fld=(p,l,t="number",ph=0)=>{const v=p.split(".").reduce((o,k)=>o[k],S.cfg);return `<label>${l}<input class="${ph?"ph":""}" type="${t==="pct"?"number":t}" step="any" data-p="${p}" data-t="${t}" value="${t==="pct"?Math.round(v*1000)/10:v}"></label>`};
const mode=(p,ph)=>{const v=S.cfg[p].mode;return `<label>Pagamento<select class="${ph?"ph":""}" data-p="${p}.mode"><option value="w" ${v==="w"?"selected":""}>Semanal</option><option value="q" ${v==="q"?"selected":""}>Quinzenal</option><option value="m" ${v==="m"?"selected":""}>Mensal</option></select></label>`};
function aj(){
 const c=S.cfg,job=(k,t,ph,fix)=>`<div class="card"><b>${t}</b><div class="g2" style="margin-top:8px">${fld(k+".rate","Valor/hora (€)","number",ph)}${fld(k+".hrs",fix?"Horas/semana (fixas)":"Horas/semana (média)")}${mode(k,ph)}${fld(k+".ref","Data de um pagamento (se quinzenal ou semanal)","date",ph)}${fld(k+".day","Dia do mês (se mensal)","number",ph)}</div></div>`;
 return `<div class="note">Campos em amarelo são suposições minhas: confirme com os valores reais.</div><h2>Rendimentos</h2>
 <div class="card"><b>Lucas</b><div class="g2" style="margin-top:8px">${fld("lucas.rate","Valor/hora (€)")}${fld("lucas.hrs","Horas/semana (média)")}${fld("lucas.day","Dia do pagamento (mensal)")}</div></div>
 ${job("pen","Yohana, Penneys",1,1)}${job("bk","Yohana, Burger King",1,0)}
 <div class="card"><div class="g2">${fld("tl","Desconto estimado, Lucas (%)","pct",1)}${fld("ty","Desconto estimado, Yohana (%)","pct",1)}</div></div>
 <h2>Metas e parâmetros</h2><div class="card"><div class="g2">${fld("reserve","Reserva de emergência (€)")}${fld("aporte","Aporte mensal no Brasil (€)","number",1)}${fld("apDay","Dia do aporte","number",1)}${fld("fx","Câmbio (R$ por €1)","number",1)}${fld("outros","Outros gastos mensais (€)","number",1)}${fld("end","Fim do ciclo","date",1)}${fld("saldo0","Saldo inicial em conta (€)")}${fld("saldoDate","Data do saldo inicial","date")}${fld("start","Início do acompanhamento (segunda)","date")}</div></div>
 <h2>Gastos fixos</h2><div class="card">${c.exp.map((e,i)=>`<div class="er"><label>Item<input data-e="${i}" data-k="n" value="${e.n}"></label><label>Valor (€)<input type="number" step="any" data-e="${i}" data-k="v" value="${e.v}"></label><label>Frequência<select data-e="${i}" data-k="f"><option value="m" ${e.f==="m"?"selected":""}>Mensal</option><option value="w" ${e.f==="w"?"selected":""}>Semanal</option></select></label><label>Dia do mês<input type="number" data-e="${i}" data-k="d" value="${e.d}"></label><label>Pessoas<input type="number" data-e="${i}" data-k="p" value="${e.p}"></label><button class="btn" data-del="${i}">✕</button></div>`).join("")}<button class="btn" id="add">+ Adicionar gasto</button></div>
 <h2>Investimentos no Brasil (R$)</h2><div class="card"><div class="g2">${fld("inv.l","Lucas (R$)")}${fld("inv.y","Yohana (R$)")}</div></div>`}

function show(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 $("#main").innerHTML=t==="s"?sem():t==="p"?plano():aj();if(t==="s")out();
 const M=calc();$("#sub").textContent="Ciclo até "+S.cfg.end.split("-").reverse().join("/")+" · faltam "+Math.max(0,Math.ceil((dn(S.cfg.end)-today)/7))+" semanas"}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.t)show(b.dataset.t);
 else if(b.dataset.del!=null){S.cfg.exp.splice(+b.dataset.del,1);save();show("a")}
 else if(b.id==="add"){S.cfg.exp.push({n:"Novo gasto",v:0,f:"m",d:1,p:1});save();show("a")}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="wsel"){cur=t.value;show("s");return}
 if(t.dataset.w){const k=t.dataset.w,v=t.value===""?null:+t.value;const x=S.weeks[cur]=S.weeks[cur]||{};
  if(v==null)delete x[k];else x[k]=v;if(!Object.keys(x).length)delete S.weeks[cur];save();out();return}
 if(t.dataset.p){const path=t.dataset.p.split("."),last=path.pop(),o=path.reduce((a,k)=>a[k],S.cfg);
  let v=t.type==="date"||t.tagName==="SELECT"?t.value:+t.value;if(t.dataset.t==="pct")v=v/100;o[last]=v;save();return}
 if(t.dataset.e!=null){const e2=S.cfg.exp[+t.dataset.e],k=t.dataset.k;e2[k]=(k==="n"||k==="f")?t.value:+t.value;save()}});

(async()=>{
 const wk=calc().rows;cur=(wk.filter(r=>r.w<=today).pop()||wk[0]).k;show("s");
 let ls=null;try{ls=JSON.parse(localStorage.getItem("pf")||"null")}catch(e){}
 let db=null;try{if(window.claude&&claude.use)db=await claude.use("db")}catch(e){}
 if(!db){apply(ls);setSt("Salvo só neste navegador");refresh();return}
 ref=db.doc("state/main");const to=setTimeout(()=>setSt("Dados ainda sem resposta"),10000);
 ref.onSnapshot(s=>{clearTimeout(to);if(s.exists)apply(s.data());setSt(s.metadata&&s.metadata.hasPendingWrites?"Salvando…":"Salvo");refresh()},()=>{clearTimeout(to);setSt("Sem acesso aos dados")})})();
</script></body></html>
